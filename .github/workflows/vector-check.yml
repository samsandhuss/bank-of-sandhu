name: Vector Retrieval Check

on:
  push:
    paths:
      - "learning/vector_pipeline_real.py"
      - "learning/test_retrieval.py"
  pull_request:
    paths:
      - "learning/vector_pipeline_real.py"
      - "learning/test_retrieval.py"

jobs:
  retrieval-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install chromadb scikit-learn pytest

      - name: Run retrieval regression tests
        run: pytest test_retrieval.py -v
